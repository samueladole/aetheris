name: CI

on:
  push:
    branches: [specs, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      - name: Install project
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      # Principle I: fails on any non-permissive license (exit 3)
      - name: License gate (Principle I)
        run: .venv/bin/aetheris check-licenses --strict

      # Principle II: fails on any layer boundary violation
      - name: Import contracts (Principle II)
        run: .venv/bin/lint-imports

      - name: Lint
        run: .venv/bin/ruff check src/ tests/

      - name: Type check
        run: .venv/bin/mypy src/ || true

      # Integration tests replay vcrpy cassettes; no live provider calls,
      # so free-tier quota is never consumed in CI.
      - name: Tests
        run: .venv/bin/pytest tests/
