name: CI

on:
  push:
    branches: [specs, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      # The docs extra is needed because contract tests build the docs site.
      # --torch-backend cpu: PyPI's Linux torch is the CUDA build, which pulls
      # in NVIDIA's proprietary wheels. Aetheris is CPU-only (Principle I).
      - name: Install project
        run: uv pip install --python .venv/bin/python -e ".[dev,docs]" --torch-backend cpu

      # Principle I: fails on any non-permissive license (exit 3).
      # STRICT mode. The four accepted transitive deviations are recorded in
      # constitution-amendments.md A-001 and exempted by name in the gate, so
      # strict mode means "no violation outside the accepted list". A newly
      # introduced non-permissive dependency fails here.
      - name: License gate (Principle I) — Python
        run: .venv/bin/aetheris check-licenses --strict

      # The Python gate cannot see Node packages, and the documentation
      # accessibility gates depend on two of them (html-validate,
      # @playwright/test). A gate that silently skips half the toolchain is
      # not a gate.
      - name: License gate (Principle I) — Node
        run: |
          npm ci --ignore-scripts
          node scripts/check_licenses.js

      # Principle II: fails on any layer boundary violation
      - name: Import contracts (Principle II)
        run: .venv/bin/lint-imports

      # The rendered accessibility gate tests drive a real browser.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: .venv/bin/ruff check src/ tests/

      - name: Type check
        run: .venv/bin/mypy src/ || true

      # Integration tests replay vcrpy cassettes; no live provider calls,
      # so free-tier quota is never consumed in CI.
      - name: Tests
        run: .venv/bin/pytest tests/

      # The README is prose, so it drifts silently. This recomputes the facts
      # most likely to go stale — test count, CLI surface, import contracts,
      # reference pages, and every referenced path — and fails if the README
      # disagrees with the repository.
      - name: README sync check
        run: .venv/bin/python scripts/check_readme_sync.py

  # Documentation site (feature 001-docs-site-cicd).
  # Separate job: it needs the `docs` extra plus Node tooling, and a failure
  # here must not be confused with a pipeline-code failure.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      - name: Install project with docs extra
        run: uv pip install --python .venv/bin/python -e ".[dev,docs]" --torch-backend cpu

      - name: Install Node accessibility tooling
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Every gate, in order: docstrings (FR-006), strict site build (FR-010),
      # secret scan (FR-017), built-HTML repair, structural and rendered
      # accessibility (FR-019, FR-020). Running the CLI rather than copying its
      # steps keeps CI and local builds identical; a copied list once dropped
      # the repair step and failed 209 accessibility checks that pass locally.
      - name: Documentation gates
        run: .venv/bin/aetheris docs build
