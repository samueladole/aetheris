[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris"
version = "0.1.0"
description = "Financial Intelligence Knowledge Graph & Sentiment Analysis Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Adole" }]

# --- Runtime dependencies (all permissively licensed; see research.md) ------
dependencies = [
    # Durable orchestration — MIT (PyPI package is `dbos`; "DBOS Transact"
    # is the product name, not the package name — corrected during T002)
    "dbos>=3.0",
    # Graph storage — MIT
    "duckdb>=1.0",
    # Sentiment model runtime — Apache-2.0 / BSD-style
    "transformers>=4.40",
    "tokenizers>=0.19",
    "safetensors>=0.4",
    "torch>=2.2",
    # Telemetry — Apache-2.0
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "prometheus-client>=0.20",
    # Evaluation — Apache-2.0
    "mlflow>=2.14",
    "evidently>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "vcrpy>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
aetheris = "src.cli.main:main"

# --- setuptools layout ------------------------------------------------------
# The spec/plan specify the tree as src/<layer>/, so the importable package is
# literally `src` and subpackages are `src.orchestration`, `src.graph`, etc.
# `where = ["."]` + `include = ["src*"]` makes setuptools discover `src` as the
# top-level package (using where=["src"] would instead install the layers as
# top-level packages like `orchestration`, which is not what the code imports).
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "contract: contract tests (no network)",
    "integration: integration tests (cassette replay, no live calls)",
]

# --- ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# --- import-linter: Principle II boundary contracts -------------------------
# Contracts live in .importlinter (T013). Deliberately NOT duplicated into
# pyproject.toml: a [tool.importlinter] section here would take precedence
# over .importlinter and silently drop every contract.
